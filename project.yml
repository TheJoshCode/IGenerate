name: IGenerate
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"

configs:
  Debug: debug
  Release: release

packages:
  MLXKlein:
    url: https://github.com/xocialize/flux2-klein-swift
    from: 0.1.0

targets:
  IGenerate:
    type: application
    platform: iOS
    sources:
      - path: IGenerate
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: IGenerate
        UILaunchScreen: {}
        UIRequiredDeviceCapabilities: [arm64]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yourname.igenerate
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
    dependencies:
      - package: MLXKlein
        product: MLXKlein
      - package: MLXKlein
        product: MLXToolKit
